<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Conversor de moeda</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <section id="complete-body">
        <header id="header-content">
            <div id="title">
                <img src="assets/ArrowsDownUp.svg" alt="">
                <span>CONVERT</span>
            </div>
        </header>

        <section class="convert-content">
            <div class="form-content">
                <div id="input">
                    <label for="inputValor">VALOR</label>
                    <input type="text" id="inputValor" placeholder="0,00">
                </div>

                <div id="select">
                <label for="moedaOrigem">MOEDA</label>
                    <select required id="moedaOrigem" >
                        <option value="" selected disabled hidden>Selecione uma moeda</option>
                        <option value="USD">Dólar americano</option>
                        <option value="EUR">Euro</option>
                        <option value="JPY">Iene Japonês</option>
                        <option value="ARS">Peso Argentino</option>
                        <option value="CNY">Yuan chinês</option>
                    </select>
                </div>

                <button type="button">Converter em reais</button>
            </div>

            <div class="result-content show-result">
                <span id="convert">US$ 1 =  R$4,86</span>
                <p id="result">486,00 Reais</p>
            </div>
        </section>
    </section>
</body>

<script src="./js/script.js"></script>
</html>
