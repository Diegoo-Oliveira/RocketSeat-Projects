<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&family=Inconsolata:wght@200..900&family=Maven+Pro:wght@400..900&display=swap" rel="stylesheet">
    <title>Portifolio Dev</title>
</head>
<body>
    <div class="container">
        <section id="info">
            <header>
                <div id="avatar">
                    <img src="Assets/icons/code.svg" alt="Simbolo de codigo">
                    <figure id="User">
                        <img src="Assets/Image.png" alt="Foto de Martina Santos">
                        <img src="Assets/Border.svg" alt="Borda da foto de Martina Santos">
                    </figure>
                </div>

                <div id="Text">
                    <p class="subtitle">Hello World! Meu nome é Martina Santos e sou</p>
                    <h1 class="title-lg">Desenvolvedora Fullstack</h1>
                </div>

                <p class="text-sm">Transformo necessidades em aplicações reais, evolventes e funcionais. Desenvolvo sistemas através da minha paixão pela tecnologia, contribuindo com soluções inovadoras e eficazes para desafios complexos.</p>
            </header>

            <section id="tags">
                <figure class="tag">
                    <img src="Assets/icons/GitHub.svg" alt="Simbolo do github">
                    <span>Github</span>
                </figure>

                <figure class="tag">
                    <img src="Assets/icons/HTML.svg" alt="Simbolo da linguagem HTML">
                    <span>HTML</span>
                </figure>

                <figure class="tag">
                    <img src="Assets/icons/CSS.svg" alt="Simbolo da linguagem CSS">
                    <span>CSS</span>
                </figure>

                <figure class="tag">
                    <img src="Assets/icons/JavaScript.svg" alt="Simbolo da linguagem JavaScript">
                    <span>JavaScript</span>
                </figure>

                <figure class="tag">
                    <img src="Assets/icons/React.svg" alt="Simbolo da lingaugem React">
                    <span>React</span>
                </figure>

                <figure class="tag">
                    <img src="Assets/icons/Node.js.svg" alt="Simbolo da linguagem Nodejs">
                    <span>Nodejs</span>
                </figure>
            </section>
        </section>

        <img src="Assets/icons/CaretDoubleDown.png" alt="Icone de duas setas para baixo">
    </div>
</body>
</html>
